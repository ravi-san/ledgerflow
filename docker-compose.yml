services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ledgerflow
      POSTGRES_PASSWORD: ledgerflow
      POSTGRES_DB: ledgerflow_development
    ports: ["5432:5432"]
    volumes: [ledgerflow_pg:/var/lib/postgresql/data]
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
volumes:
  ledgerflow_pg:
